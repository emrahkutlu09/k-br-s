<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kıbrıs Çarşı | Süper Admin Kontrol Merkezi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen flex flex-col">

    <div id="loginScreen" class="fixed inset-0 bg-slate-950 z-[100] flex flex-col items-center justify-center p-4">
        <div class="bg-slate-900 p-8 rounded-3xl max-w-sm w-full text-center space-y-6 border border-slate-800 shadow-2xl">
            <h2 class="text-2xl font-black text-white">Süper Admin Paneli</h2>
            <p class="text-xs text-slate-400">Mağazaları ve paket aboneliklerini yönetmek için giriş yapın.</p>
            <button onclick="window.loginAdmin()" class="w-full bg-white text-slate-900 font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 transition">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5"> Google ile Giriş Yap
            </button>
            <a href="index.html" class="block text-xs font-bold text-slate-500 hover:text-white">Pazaryerine Dön</a>
        </div>
    </div>

    <div id="adminApp" class="hidden flex-col min-h-screen">
        <div class="bg-slate-950 text-slate-300 text-xs py-3 px-6 font-medium border-b border-slate-800 sticky top-0 z-40 flex justify-between items-center">
            <span class="font-bold uppercase text-rose-400 flex items-center gap-2"><i data-lucide="shield-check" class="w-4 h-4"></i> Süper Admin Merkezi</span>
            <button onclick="signOut(auth)" class="text-rose-400 font-bold hover:underline">Çıkış Yap</button>
        </div>

        <main class="flex-1 max-w-7xl mx-auto px-4 py-8 w-full space-y-8">
            <h2 class="text-xl font-black">Mağaza ve Paket Abonelikleri</h2>
            
            <div class="bg-slate-800/30 border border-slate-700/50 rounded-3xl overflow-hidden">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-slate-800/50 text-slate-400 text-[10px] uppercase font-bold">
                        <tr>
                            <th class="px-6 py-4">Mağaza</th>
                            <th class="px-6 py-4">Mevcut Paket</th>
                            <th class="px-6 py-4">Paket Değiştir</th>
                            <th class="px-6 py-4">Süre Uzat</th>
                            <th class="px-6 py-4 text-right">İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="storesTableBody" class="divide-y divide-slate-700/50 text-slate-300"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCHms5Y5x-KOu3Y43FrfRoljmW_4m3H4yY",
            authDomain: "kibris-6b4f7.firebaseapp.com",
            projectId: "kibris-6b4f7",
            storageBucket: "kibris-6b4f7.firebasestorage.app",
            messagingSenderId: "141262926171",
            appId: "1:141262926171:web:07226845e51d4bbc0dea7e",
            measurementId: "G-JL9P6BRZTD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        const APP_ID = 'kibris-pazar'; 
        const storesRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'stores');

        let dbStores = [];

        onAuthStateChanged(auth, (user) => {
            if(user) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminApp').classList.remove('hidden');
                document.getElementById('adminApp').classList.add('flex');
                initData();
            } else {
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('adminApp').classList.add('hidden');
            }
        });

        window.loginAdmin = async () => { await signInWithPopup(auth, provider); };

        function initData() {
            onSnapshot(storesRef, (snap) => {
                dbStores = [];
                snap.forEach(doc => dbStores.push({id: doc.id, ...doc.data()}));
                renderStores();
            });
        }

        function renderStores() {
            const tbody = document.getElementById('storesTableBody');
            let html = '';
            dbStores.forEach(s => {
                const pkg = s.packageType || 'free';
                let pkgBadge = `<span class="bg-slate-700 px-2 py-1 rounded text-[10px] font-bold">Ücretsiz</span>`;
                if(pkg === 'standard') pkgBadge = `<span class="bg-blue-600 px-2 py-1 rounded text-[10px] font-bold">Standart</span>`;
                if(pkg === 'premium') pkgBadge = `<span class="bg-purple-600 px-2 py-1 rounded text-[10px] font-bold">Premium VIP</span>`;

                html += `
                    <tr>
                        <td class="px-6 py-4 font-bold text-white">${s.name}</td>
                        <td class="px-6 py-4">${pkgBadge}</td>
                        <td class="px-6 py-4 space-x-1">
                            <button onclick="window.setPackage('${s.id}', 'free')" class="bg-slate-800 px-2 py-1 rounded text-[10px]">Ücretsiz</button>
                            <button onclick="window.setPackage('${s.id}', 'standard')" class="bg-blue-900 px-2 py-1 rounded text-[10px]">Standart</button>
                            <button onclick="window.setPackage('${s.id}', 'premium')" class="bg-purple-900 px-2 py-1 rounded text-[10px]">Premium</button>
                        </td>
                        <td class="px-6 py-4">
                            <button onclick="window.addTime('${s.id}', 30)" class="bg-emerald-900 px-2 py-1 rounded text-[10px]">+30 Gün</button>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <button onclick="window.toggleStatus('${s.id}', '${s.status === 'active' ? 'suspended' : 'active'}')" class="px-3 py-1 rounded text-xs font-bold ${s.status === 'active' ? 'bg-amber-600' : 'bg-emerald-600'} text-white">
                                ${s.status === 'active' ? 'Askıya Al' : 'Aktif Et'}
                            </button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        window.setPackage = async (id, type) => {
            await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'stores', id), { packageType: type });
            alert("Paket güncellendi!");
        };

        window.addTime = async (id, days) => {
            const store = dbStores.find(s => s.id === id);
            let current = (store.expiryDate && store.expiryDate > Date.now()) ? store.expiryDate : Date.now();
            await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'stores', id), { expiryDate: current + (days * 86400000) });
            alert("Süre uzatıldı!");
        };

        window.toggleStatus = async (id, status) => {
            await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'stores', id), { status: status });
        };
        
        window.signOut = () => { signOut(auth); };
        lucide.createIcons();
    </script>
</body>
</html>
