    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Yapılandırması (Admin panelinizdeki konfigürasyon)
        const firebaseConfig = {
            apiKey: "AIzaSyCHms5Y5x-KOu3Y43FrfRoljmW_4m3H4yY",
            authDomain: "kibris-6b4f7.firebaseapp.com",
            projectId: "kibris-6b4f7",
            storageBucket: "kibris-6b4f7.firebasestorage.app",
            messagingSenderId: "141262926171",
            appId: "1:141262926171:web:07226845e51d4bbc0dea7e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_ID = 'kibris-pazar';

        // Durum (State) Değişkenleri
        let allProducts = [];
        let allCategories = [];
        let currentFilters = {
            search: '',
            category: 'all',
            minPrice: null,
            maxPrice: null,
            sort: 'newest'
        };

        // Mobil Menü İşlevleri
        window.toggleMobileFilters = () => {
            const sidebar = document.getElementById('filterSidebar');
            const overlay = document.getElementById('mobileOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('hidden');
        };

        // Auth ve Veri Çekme (Kurallara uygun: Önce Auth, Sonra Veri)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                fetchInitialData();
            } else {
                signInAnonymously(auth).catch(err => console.error("Auth hatası:", err));
            }
        });

        function fetchInitialData() {
            // Kategorileri Çek
            const catRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'categories');
            onSnapshot(catRef, (snap) => {
                allCategories = [];
                snap.forEach(doc => allCategories.push({id: doc.id, ...doc.data()}));
                
                // Ana Kategorileri Alfabetik Sırala
                allCategories.sort((a,b) => a.name.localeCompare(b.name));
                renderCategoryFilters();
            }, (error) => {
                console.error("Kategori çekme hatası:", error);
            });

            // Ürünleri Çek
            const prodRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'products');
            onSnapshot(prodRef, (snap) => {
                allProducts = [];
                snap.forEach(doc => allProducts.push({id: doc.id, ...doc.data()}));
                applyFilters(); // Veri geldiğinde filtreleri uygula
            }, (error) => {
                console.error("Ürün çekme hatası:", error);
            });
        }

        function renderCategoryFilters() {
            const container = document.getElementById('categoryFilterContainer');
            document.getElementById('catCount').innerText = allCategories.length;
            
            let html = `
                <label class="flex items-center gap-3 cursor-pointer group mb-2">
                    <input type="radio" name="catFilter" value="all" ${currentFilters.category === 'all' ? 'checked' : ''} onchange="updateCategoryFilter('all')" class="w-4 h-4 text-orange-500 bg-slate-100 border-slate-300 focus:ring-orange-500 focus:ring-2">
                    <span class="text-sm font-medium ${currentFilters.category === 'all' ? 'text-orange-500 font-bold' : 'text-slate-600'} group-hover:text-orange-500 transition">Tüm Kategoriler</span>
                </label>
            `;

            allCategories.forEach(cat => {
                const isChecked = currentFilters.category === cat.name;
                html += `
                    <label class="flex items-center gap-3 cursor-pointer group mb-2">
                        <input type="radio" name="catFilter" value="${cat.name}" ${isChecked ? 'checked' : ''} onchange="updateCategoryFilter('${cat.name.replace(/'/g, "\\'")}')" class="w-4 h-4 text-orange-500 bg-slate-100 border-slate-300 focus:ring-orange-500 focus:ring-2">
                        <span class="text-sm font-medium ${isChecked ? 'text-orange-500 font-bold' : 'text-slate-600'} group-hover:text-orange-500 transition truncate">${cat.name}</span>
                    </label>
                `;
            });
            container.innerHTML = html;
        }

        window.updateCategoryFilter = (catName) => {
            currentFilters.category = catName;
            applyFilters();
            renderCategoryFilters(); // UI'da seçili kalmasını sağla
        };

        window.handleSearchInput = (val) => {
            // Her iki arama kutusunu da senkronize et
            document.getElementById('mainSearchInput').value = val;
            document.getElementById('mobileSearchInput').value = val;
            currentFilters.search = val.toLowerCase().trim();
            applyFilters();
        };

        window.resetFilters = () => {
            currentFilters = { search: '', category: 'all', minPrice: null, maxPrice: null, sort: 'newest' };
            document.getElementById('mainSearchInput').value = '';
            document.getElementById('mobileSearchInput').value = '';
            document.getElementById('minPriceInput').value = '';
            document.getElementById('maxPriceInput').value = '';
            document.getElementById('sortFilter').value = 'newest';
            
            renderCategoryFilters();
            applyFilters();
        };

        // ANA FİLTRELEME MOTORU (Bellekte Filtreleme Kuralı - Rule 2)
        window.applyFilters = () => {
            // UI'dan değerleri al
            currentFilters.sort = document.getElementById('sortFilter').value;
            const minVal = document.getElementById('minPriceInput').value;
            const maxVal = document.getElementById('maxPriceInput').value;
            currentFilters.minPrice = minVal ? parseFloat(minVal) : null;
            currentFilters.maxPrice = maxVal ? parseFloat(maxVal) : null;

            // 1. FİLTRELEME ADIMI
            let result = allProducts.filter(p => {
                // Arama Filtresi
                let matchSearch = true;
                if (currentFilters.search) {
                    const s = currentFilters.search;
                    matchSearch = (p.title && p.title.toLowerCase().includes(s)) || 
                                  (p.description && p.description.toLowerCase().includes(s)) ||
                                  (p.storeName && p.storeName.toLowerCase().includes(s));
                }

                // Kategori Filtresi
                let matchCategory = true;
                if (currentFilters.category !== 'all') {
                    matchCategory = p.category === currentFilters.category;
                }

                // Fiyat Filtresi
                let matchPrice = true;
                const price = parseFloat(p.price) || 0;
                if (currentFilters.minPrice !== null && price < currentFilters.minPrice) matchPrice = false;
                if (currentFilters.maxPrice !== null && price > currentFilters.maxPrice) matchPrice = false;

                return matchSearch && matchCategory && matchPrice;
            });

            // 2. SIRALAMA ADIMI
            if (currentFilters.sort === 'price_asc') {
                result.sort((a, b) => (parseFloat(a.price) || 0) - (parseFloat(b.price) || 0));
            } else if (currentFilters.sort === 'price_desc') {
                result.sort((a, b) => (parseFloat(b.price) || 0) - (parseFloat(a.price) || 0));
            } else if (currentFilters.sort === 'name_asc') {
                result.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
            } else {
                // En yeniler (newest) varsayılan
                result.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            }

            renderProductsToDOM(result);
            updateActiveFilterTags();
        };

        function renderProductsToDOM(products) {
            const grid = document.getElementById('productsGrid');
            const emptyState = document.getElementById('emptyState');
            document.getElementById('resultCount').innerText = products.length;

            if (products.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');

            let html = '';
            products.forEach(p => {
                const img = (p.images && p.images.length > 0) ? p.images[0] : 'https://placehold.co/400x400/f8fafc/94a3b8?text=Gorsel+Yok';
                const priceStr = parseFloat(p.price || 0).toLocaleString('tr-TR');
                
                html += `
                    <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden hover:shadow-xl hover:shadow-orange-500/10 transition duration-300 group flex flex-col h-full cursor-pointer" onclick="localStorage.setItem('current_product_id', '${p.id}'); window.location.href='urun.html'">
                        <div class="relative aspect-square overflow-hidden bg-slate-50">
                            <img src="${img}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            ${p.isPremium ? '<div class="absolute top-2 left-2 bg-purple-500 text-white text-[9px] font-black px-2 py-1 rounded-md uppercase tracking-wider shadow-lg"><i data-lucide="award" class="w-3 h-3 inline"></i> Öne Çıkan</div>' : ''}
                        </div>
                        <div class="p-3 sm:p-4 flex flex-col flex-1">
                            <div class="text-[10px] text-orange-500 font-bold uppercase tracking-wider mb-1 truncate">${p.category || 'Diğer'}</div>
                            <h3 class="font-bold text-slate-800 text-sm mb-2 line-clamp-2 leading-snug group-hover:text-orange-500 transition">${p.title}</h3>
                            
                            <div class="mt-auto pt-3 flex items-end justify-between border-t border-slate-50">
                                <div>
                                    <div class="text-[10px] text-slate-400 mb-0.5 flex items-center gap-1 truncate max-w-[100px]">
                                        <i data-lucide="store" class="w-3 h-3"></i> ${p.storeName || 'Mağaza'}
                                    </div>
                                    <div class="font-black text-slate-900 text-base sm:text-lg">${priceStr} <span class="text-xs text-slate-500 font-medium">TL</span></div>
                                </div>
                                <button class="w-8 h-8 rounded-full bg-orange-50 text-orange-500 flex items-center justify-center group-hover:bg-orange-500 group-hover:text-white transition">
                                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
            lucide.createIcons(); // İkonları render et
        }

        function updateActiveFilterTags() {
            const container = document.getElementById('activeFiltersContainer');
            let tags = [];

            if (currentFilters.search) {
                tags.push(`Aranan: <b>"${currentFilters.search}"</b>`);
            }
            if (currentFilters.category !== 'all') {
                tags.push(`Kategori: <b>${currentFilters.category}</b>`);
            }
            if (currentFilters.minPrice !== null || currentFilters.maxPrice !== null) {
                let pText = 'Fiyat: ';
                if(currentFilters.minPrice) pText += `${currentFilters.minPrice}TL - `; else pText += '0TL - ';
                if(currentFilters.maxPrice) pText += `${currentFilters.maxPrice}TL`; else pText += 'Üstü';
                tags.push(pText);
            }

            if (tags.length > 0) {
                container.innerHTML = tags.map(t => `<span class="bg-orange-50 text-orange-600 border border-orange-200 px-3 py-1.5 rounded-lg text-xs flex items-center gap-2">${t}</span>`).join('') + 
                `<button onclick="resetFilters()" class="text-xs text-slate-500 hover:text-rose-500 underline underline-offset-2">Tümünü Temizle</button>`;
            } else {
                container.innerHTML = '';
            }
        }

        // Sayfa yüklendiğinde ikonları oluştur
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });

    </script>
</body>
</html>
