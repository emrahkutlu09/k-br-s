[[edge_functions]]
  path = "/sitemap.xml"
  function = "sitemap"

[[edge_functions]]
  path = "/sitemap-products-*.xml"
  function = "sitemap-products"

[[edge_functions]]
  path = "/sitemap-stores.xml"
  function = "sitemap-stores"

[[edge_functions]]
  path = "/sitemap-categories.xml"
  function = "sitemap-categories"

[[edge_functions]]
  path = "/urun/*"
  function = "seo-bot"

[[edge_functions]]
  path = "/magaza/*"
  function = "seo-bot"

[[edge_functions]]
  path = "/kategori/*"
  function = "seo-bot"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
